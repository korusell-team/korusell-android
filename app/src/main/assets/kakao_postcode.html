<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Kakao Postcode Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        #postcode {
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="postcode"></div>
<script>
    const params = new URLSearchParams(window.location.search);
    const themeBase64 = params.get('theme');
    let themeObj = {};
    if (themeBase64) {
      try {
        themeObj = JSON.parse(atob(themeBase64));
      } catch (e) {
        themeObj = {};
      }
    }
    new daum.Postcode({
        oncomplete: function(data) {
            console.log("oncomplete", data);
            if (window.Android && window.Android.onSelect) {
                window.Android.onSelect(JSON.stringify(data));
            } else {
                alert("Android interface not found");
            }
        },
        width: '100%',
        height: '100%',
        theme: themeObj
    }).embed(document.getElementById('postcode'));
</script>
</body>
</html>
